paths:
  raw: data/raw
  labels: data/labels.csv
  gmdcsa24_fall_times: data/annotations/gmdcsa24_fall_times.csv
  keypoints: data/keypoints
  windows: data/features/windows.parquet
  sequences: data/features/sequences.npz
  models: models
  tables: results/tables
  figures: results/figures
  logs: logs

datasets:
  train: [urfd, gmdcsa24]
  test: [caucafall]

pose:
  task_file: models/pose_landmarker_full.task
  num_poses: 1
  min_visibility: 0.5

labels:
  caucafall_lead_s: 1.0
  caucafall_tail_s: 0.5

windows:
  rate_hz: 15
  length_s: 2.0
  stride_s: 0.5
  positive_min_overlap: 0.5
  max_missing_fraction: 0.3
  max_gap_fill_s: 0.3

evaluation:
  seed: 0
  outer_folds: 5
  inner_folds: 3
  recall_target: 0.90
  tuning_metric: f1

baseline:
  last_s: 0.5
  published_ratio: 1.0
  published_angle_deg: 45.0
  default_speed_tl_per_s: 1.0
  grid_ratio: [0.6, 0.8, 1.0, 1.2, 1.5, 2.0]
  grid_angle_deg: [30.0, 45.0, 60.0, 75.0]
  grid_speed_tl_per_s: [0.5, 1.0, 1.5, 2.0, 3.0, 4.0]

models:
  imputer_strategy: median
  n_jobs: -1
  nb:
    grid:
      var_smoothing: [1.0e-9, 1.0e-6, 1.0e-3, 1.0e-1]
  rf:
    n_estimators: 300
    grid:
      max_depth: [null, 5, 10]
      min_samples_leaf: [1, 3, 10]
  svm:
    grid:
      C: [0.1, 1.0, 10.0, 100.0]
      gamma: [scale, 0.01, 0.1]
  lstm:
    units_grid: [16, 32, 64]
    default_units: 32
    dropout: 0.3
    learning_rate: 0.001
    epochs: 80
    patience: 8
    batch_size: 32
    val_splits: 4
    noise_std: 0.02

demo:
  model_file: models/best.joblib
  rule_file: models/rule.joblib
  eval_interval_s: 0.2
  consecutive_positives: 2
  cooldown_s: 10
  confirm_lying_s: 3
  camera_offline_s: 3
  heartbeat_s: 10
  restart_backoff_start_s: 1
  restart_backoff_max_s: 30
  panel_height: 480
  fps_window_s: 1.0
  score_bar_half_width: 1.5
  beep_hz: 880
  beep_s: 0.5
  beep_volume: 0.3
  benchmark_frames: 300

report:
  dpi: 150
  confusion_size_in: [15.0, 3.4]
  pr_size_in: [13.0, 4.2]
  importance_size_in: [7.0, 4.5]
  test_confusion_size_in: [10.0, 3.6]
  tradeoff_recall_targets: [0.90, 0.95, 0.98]
  dataset_titles:
    urfd: URFD
    gmdcsa24: GMDCSA-24
    caucafall: CAUCAFall
  top_n_features: 10
